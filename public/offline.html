<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        p {
            font-size: 1.4em;
            margin-bottom: 40px;
            max-width: 600px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            color: white;
            text-decoration: none;
            display: inline-block;
        }

        .home-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .reconnect-btn {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5em;
            }

            p {
                font-size: 1.2em;
            }

            .buttons {
                flex-direction: column;
                align-items: center;
            }

            button {
                width: 250px;
            }
        }
    </style>
</head>

<body>
    <h1>📴 Offline</h1>
    <p>Ops! Você está sem conexão com a internet. 😵‍💫<br>Tente reconectar ou volte ao início.</p>
    <div class="buttons">
        <a href="/" class="home-btn" style="text-decoration: none;">🏠 Voltar ao Início</a>
        <button class="reconnect-btn" onclick="location.reload()">🔄 Tentar Reconectar</button>
    </div>
</body>

</html>
